<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="description" content="%NAME%, %ROLE%. A small world of floating islands, one for each part of my work." />

    <script>document.documentElement.classList.add('js');</script>

  <body>
    <div id="root"></div>

    <!-- The loading screen: our own world in stills, slowly pushing in, while the real one is built behind it. -->
    <div id="loading" aria-busy="true">
      <div class="ld-base" aria-hidden="true"></div>
      <div class="ld-art" aria-hidden="true"></div>
      <div class="ld-shade" aria-hidden="true"></div>
      <div class="ld-mark">
        <svg class="ld-glyph" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 12.5h24M7 12.5l4.5 6.5 2.5-2 2 6 2.5-3.5 2 2.5 4.5-9.5M14 12.5V8.5l2-3 2 3v4" /></svg>
        <span class="ld-wm">%NAME_CAPS%</span>
      </div>
      <div class="ld-foot">
        <div class="ld-row">
          <div class="ld-lines" aria-hidden="true"><div class="ld-set"><!--LINES--></div><p class="ld-slow">Still raising the islands. A big world takes a moment on a slow connection.</p></div>
          <div class="ld-pct" aria-hidden="true"><span class="col"><b><i>&nbsp;</i><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i><i>7</i><i>8</i><i>9</i></b></span><span class="col"><b><i>0</i><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i><i>7</i><i>8</i><i>9</i></b></span><span class="full">100</span><span>%</span></div>
          <div class="ld-fail" role="alert">
            <div><h2>The islands could not rise</h2><p>Something went wrong while starting the world. A reload usually fixes it.</p></div>
            <button type="button" onclick="location.reload()">Reload</button>
          </div>
        </div>
        <div class="ld-line" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="ld-fill"><svg class="ld-rope" viewBox="0 0 4000 8" preserveAspectRatio="xMinYMid slice" aria-hidden="true">
            <defs><pattern id="ld-ply" width="12" height="8" patternUnits="userSpaceOnUse"><g fill="none" stroke-width="2.4" stroke-linecap="round">
              <path d="M-3 6.2C0 6.2 3 1.8 6 1.8M9 6.2C12 6.2 15 1.8 18 1.8" stroke="#7a5233" />
              <path d="M0 1.8C3 1.8 6 6.2 9 6.2" stroke="rgba(10,8,6,0.55)" stroke-width="3.2" />
              <path d="M0 1.8C3 1.8 6 6.2 9 6.2M-12 1.8C-9 1.8 -6 6.2 -3 6.2M12 1.8C15 1.8 18 6.2 21 6.2" stroke="#c99a5e" />
            </g></pattern></defs>
            <rect width="4000" height="8" fill="url(#ld-ply)" />
          </svg></div>
          <div class="ld-head"><i></i></div>
        </div>
      </div>
      <p class="ld-sr" aria-live="polite">Loading</p>
    </div>

    <script>
      // Art and words for the wait. The first still is preloaded; the others are fetched one at a time a few
      // seconds before their turn, so they never compete with the world's own download. src/ui/Loader.tsx takes
      // over (progress, the hand-off to the live world); if the app never starts, the reload message shows.
      (function () {
        var L = document.getElementById('loading'), art = L.querySelector('.ld-art');
        var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
        var ART = ['01', '02', '03', '04', '05', '06'], FIRST = 11000, HOLD = 8000, FADE = 2400, i = 0, cur = null;
        function show(k) {
          var s = document.createElement('div'); s.className = 'ld-s';
          var img = new Image(); img.alt = ''; img.decoding = 'async'; img.src = '/loading/art-' + ART[k % ART.length] + '.webp';
          s.appendChild(img);
          img.decode().catch(function () {}).then(function () {
            art.appendChild(s);
            var life = (k ? HOLD : FIRST) + FADE * 2;
            s.animate([{ opacity: 0 }, { opacity: 1 }], { duration: k ? FADE : 1400, fill: 'forwards', easing: 'cubic-bezier(.33,0,.2,1)' });
            if (!still) img.animate([{ transform: 'scale(1.0)' }, { transform: 'scale(1.075)' }], { duration: life, fill: 'forwards', easing: 'linear' });
            var prev = cur; cur = s;
            if (prev) setTimeout(function () { prev.remove(); }, FADE + 200);
            L.classList.add('art-in');
          });
          setTimeout(function () { if (L.isConnected && !L.classList.contains('leaving')) show(k + 1); }, k ? HOLD + FADE : FIRST);
        }
        show(0);
        // the words: one line at a time
        var lines = L.querySelectorAll('.ld-set p'), n = 0;
        if (lines.length) { lines[0].classList.add('on'); setInterval(function () { lines[n].classList.remove('on'); n = (n + 1) % lines.length; lines[n].classList.add('on'); }, 6500); }
        // a very slow start, or none at all
        setTimeout(function () { if (!L.classList.contains('done')) L.classList.add('slow'); }, 22000);
        function fail() { if (L.isConnected && !L.classList.contains('live')) L.classList.add('err'); }
        addEventListener('error', function (e) { var t = e.target; if (t && t.tagName === 'SCRIPT') fail(); }, true);
        setTimeout(fail, 45000);
      })();
    </script>
    <noscript><p style="position:fixed;z-index:200;left:24px;bottom:24px;color:#f3eee4;font:15px system-ui">%NAME%, %ROLE%. srivastavarishabh2001@gmail.com · github.com/binaryrishabh</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
